name: Deploy to AWS Lambda

# Trigger the workflow on pushes to the main branch (adjust as needed)
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'   # or a version that matches your runtime

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Deploy using Serverless Framework
      - name: Deploy to AWS Lambda
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          CLOUD_NAME: ${{ secrets.CLOUD_NAME }}
          MONGODB: ${{ secrets.MONGODB }}
          NODEMAILER_PASS: ${{ secrets.NODEMAILER_PASS }}
          NODEMAILER_USER: ${{ secrets.NODEMAILER_USER }}
          PORT: ${{ secrets.PORT }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: npx serverless deploy
       # 6. Deploy (sync) the static build to your S3 bucket.
      - name: Deploy static build to S3
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
        run: |
          aws s3 sync client/build s3://$S3_BUCKET --delete
